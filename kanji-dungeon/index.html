<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>漢字ダンジョン 試作版</title>
<style>
:root{--bg:#111315;--panel:#1a1f22;--stone:#262c30;--line:#465159;--ink:#f0eadf;--muted:#9ba7ad;--gold:#c8a35d;--teal:#6eb4aa;--danger:#d17b72;--cell:clamp(24px,7.5vw,42px)}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 50% 0,#1d2528,#0e1113 55%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100vh}
button{font:inherit}.app{max-width:760px;margin:auto;padding:18px 14px 80px}.title{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.title h1{margin:0;font-size:22px;letter-spacing:.12em}.subtitle{font-size:12px;color:var(--muted);margin-top:4px}.reset{border:1px solid #3f494f;background:#161b1e;color:#aeb8bd;border-radius:8px;padding:7px 10px;font-size:12px}
.tabs{display:flex;gap:7px;margin:18px 0 12px;flex-wrap:wrap}.tab{border:1px solid #49545b;background:#171c1f;color:#aeb7bc;border-radius:9px;padding:8px 13px;min-width:52px}.tab.active{background:#273136;color:#fff;border-color:var(--gold);box-shadow:0 0 0 1px rgba(200,163,93,.18) inset}.panel{background:rgba(23,28,31,.92);border:1px solid #39444a;border-radius:16px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.status{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.floorname{font-weight:700;letter-spacing:.12em}.count{font-size:12px;color:var(--muted)}
.board-wrap{display:flex;justify-content:center;overflow:auto;padding:8px 0 4px}.board{display:grid;grid-template-columns:repeat(11,var(--cell));grid-template-rows:repeat(11,var(--cell));gap:2px;background:#121618;border:1px solid #313a3f;padding:7px;border-radius:12px;box-shadow:inset 0 0 30px rgba(0,0,0,.45)}
.cell{width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;position:relative;border-radius:4px;background:#15191b;color:transparent;user-select:none}.cell.path{background:#292f33;border:1px solid #4b565d;color:var(--ink);font-weight:700;font-size:clamp(15px,4.5vw,23px)}.cell.emptytext{color:transparent}.cell.cross{box-shadow:inset 0 0 0 1px rgba(110,180,170,.45)}.cell.meta-ready{cursor:pointer}.cell.meta-ready::after{content:attr(data-num);position:absolute;right:1px;top:-3px;color:#f1cc78;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}.cell.rock{background:#434b50;border:1px solid #707a80;color:#fff;font-size:14px;cursor:pointer;box-shadow:inset 0 0 10px rgba(255,255,255,.04)}.cell.hot{cursor:pointer}.cell.hot:active{transform:scale(.94)}
.section{margin-top:14px}.section-title{font-size:12px;color:#b4bec3;letter-spacing:.12em;margin-bottom:7px}.tiles{display:flex;gap:8px;flex-wrap:wrap}.tile{width:46px;height:46px;border:1px solid #5a666d;background:linear-gradient(#f3ede0,#d8cdb9);color:#27231f;border-radius:8px;font-weight:800;font-size:22px;box-shadow:0 3px 0 #887c69;transition:.12s}.tile.selected{transform:translateY(2px);box-shadow:0 1px 0 #887c69;outline:2px solid var(--teal)}.tile.used{opacity:.28;filter:grayscale(1);box-shadow:none}.tile:disabled{cursor:default}
.inventory{display:flex;align-items:center;gap:8px;min-height:46px}.inv-label{font-size:12px;color:var(--muted)}.inv-tile{width:42px;height:42px;border-radius:8px;border:1px solid var(--gold);background:#eee4cf;color:#29231d;font-size:20px;font-weight:800}.inv-tile.selected{outline:3px solid var(--teal)}
.stairs{margin:16px auto 2px;display:none;border:1px solid #857047;background:#2a251c;color:#f3d99c;padding:11px 18px;border-radius:10px;font-weight:700}.stairs.show{display:block}.meta{margin-top:14px;border-top:1px solid #343e43;padding-top:12px;display:none}.meta.show{display:block}.slots{display:flex;gap:6px;justify-content:center}.slot{width:36px;height:42px;border-bottom:2px solid #6d787e;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700}.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#111719;border:1px solid #4c5b63;color:#fff;border-radius:10px;padding:10px 14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:86vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:24px;z-index:60}.modal.show{display:flex}.modal-card{width:min(440px,100%);background:#1a2023;border:1px solid #59666d;border-radius:16px;padding:24px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.5)}.modal-card h2{margin:0 0 12px;font-size:20px}.modal-card p{white-space:pre-line;line-height:1.9;color:#e6e1d8}.modal-card button{margin-top:12px;border:1px solid #77633c;background:#2e281d;color:#f5d99b;border-radius:9px;padding:9px 16px}.clear-title{font-size:28px;letter-spacing:.16em;color:#f0d18f}.tiny{font-size:11px;color:#879399;margin-top:14px;text-align:center}
@media(min-width:620px){:root{--cell:42px}.app{padding-top:28px}.panel{padding:18px}}
</style>
</head>
<body>
<div class="app">
  <div class="title"><div><h1>漢字ダンジョン</h1><div class="subtitle">試作版 / 熟語を作り、読みを埋める</div></div><button class="reset" id="resetBtn">最初から</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="panel">
    <div class="status"><div class="floorname" id="floorName"></div><div class="count" id="count"></div></div>
    <div class="board-wrap"><div class="board" id="board"></div></div>
    <div class="section"><div class="section-title">漢字</div><div class="tiles" id="tiles"></div></div>
    <div class="section" id="inventorySection" style="display:none"><div class="section-title">持ち物</div><div class="inventory"><div id="inventory"></div></div></div>
    <button class="stairs" id="stairs">階段を上る</button>
    <div class="meta" id="meta"><div class="slots" id="slots"></div></div>
  </div>
  <div class="tiny">※これは挙動確認用の試作。見た目・演出・語彙はあとから差し替え可能。</div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-card"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="modalBtn">閉じる</button></div></div>
<script>
const FLOORS={
1:{name:'1F',extra:'鏡',words:[
 {k:'財宝',r:'ざいほう',d:'h',row:6,col:3,id:'zaihou'},
 {k:'双璧',r:'そうへき',d:'v',row:5,col:6,id:'souheki'},
 {k:'金塊',r:'きんかい',d:'v',row:3,col:4,id:'kinkai'},
 {k:'迷路',r:'めいろ',d:'v',row:3,col:2,id:'meiro'},
 {k:'階段',r:'かいだん',d:'h',row:4,col:1,id:'kaidan'},
 {k:'危険',r:'きけん',d:'h',row:3,col:4,id:'kiken'}]},
2:{name:'2F',extra:'財',words:[
 {k:'宝石',r:'ほうせき',d:'h',row:6,col:6,id:'houseki'},
 {k:'腕輪',r:'うでわ',d:'h',row:10,col:4,id:'udewa'},
 {k:'封印',r:'ふういん',d:'v',row:5,col:7,id:'fuuin'},
 {k:'遺跡',r:'いせき',d:'v',row:4,col:9,id:'iseki'},
 {k:'真珠',r:'しんじゅ',d:'h',row:8,col:6,id:'shinju'},
 {k:'神話',r:'しんわ',d:'v',row:8,col:6,id:'shinwa'}]},
3:{name:'3F',extra:'鍵',words:[
 {k:'才能',r:'さいのう',d:'h',row:6,col:5,id:'sainou'},
 {k:'勲章',r:'くんしょう',d:'v',row:2,col:8,id:'kunshou'},
 {k:'金銀',r:'きんぎん',d:'h',row:3,col:7,id:'kingin'},
 {k:'天井',r:'てんじょう',d:'v',row:2,col:10,id:'tenjou'},
 {k:'探索',r:'たんさく',d:'v',row:4,col:5,id:'tansaku'},
 {k:'床板',r:'ゆかいた',d:'h',row:4,col:2,id:'yukaita'}]},
4:{name:'4F',extra:'門',words:[
 {k:'家系',r:'かけい',d:'h',row:6,col:5,id:'kakei'},
 {k:'警報',r:'けいほう',d:'v',row:5,col:7,id:'keihou'},
 {k:'地下',r:'ちか',d:'v',row:5,col:5,id:'chika'},
 {k:'秘宝',r:'ひほう',d:'h',row:8,col:5,id:'hihou'},
 {k:'出口',r:'でぐち',d:'h',row:5,col:3,id:'deguchi'},
 {k:'神殿',r:'しんでん',d:'v',row:3,col:3,id:'shinden'}]},
5:{name:'5F',extra:'光',words:[
 {k:'古銭',r:'こせん',d:'h',row:4,col:4,id:'kosen'},
 {k:'降下',r:'こうか',d:'v',row:4,col:4,id:'kouka'},
 {k:'予兆',r:'よちょう',d:'h',row:5,col:1,id:'yochou'},
 {k:'祭壇',r:'さいだん',d:'v',row:1,col:6,id:'saidan'},
 {k:'脱出',r:'だっしゅつ',d:'h',row:3,col:6,id:'dasshutsu'},
 {k:'珠玉',r:'しゅぎょく',d:'v',row:3,col:8,id:'shugyoku'}]}
};
const META=[
 {n:1,f:1,row:6,col:4,ch:'い'}, {n:2,f:2,row:10,col:6,ch:'わ'}, {n:3,f:3,row:6,col:7,ch:'の'},
 {n:4,f:4,row:3,col:3,ch:'し'}, {n:5,f:3,row:4,col:5,ch:'た'}, {n:6,f:5,row:5,col:1,ch:'よ'}, {n:7,f:1,row:3,col:2,ch:'め'}
];
const TILE_ORDER={
1:['危','財','迷','金','段','鏡','双','宝','路','階','険','塊','璧'],
2:['封','宝','腕','遺','珠','財','石','神','輪','跡','真','印','話'],
3:['天','鍵','床','勲','金','才','索','銀','章','板','探','井','能'],
4:['警','家','秘','門','地','殿','系','出','宝','報','神','下','口'],
5:['祭','古','珠','予','下','光','壇','銭','出','玉','降','兆','脱']
};
const SAVE='kanjiDungeonPrototypeV2';
let state=load()||{
 floor:1, unlocked:1, solved:{1:[],2:[],3:[],4:[],5:[]}, picked:{1:false,2:false,3:false,4:false,5:false},
 selected:[], inventory:[], invSelected:null, metaUnlocked:false, metaFound:[], rockRead:false, trap:false, swapped:false, finalRead:false, clear:false
};
let toastTimer=null;
function save(){localStorage.setItem(SAVE,JSON.stringify(state))}
function load(){try{return JSON.parse(localStorage.getItem(SAVE))}catch(e){return null}}
function cellsFor(word){return [...word.r].map((ch,i)=>({row:word.row+(word.d==='v'?i:0),col:word.col+(word.d==='h'?i:0),ch}))}
function floorWord(f,id){return FLOORS[f].words.find(w=>w.id===id)}
function effectiveWords(f){if(f!==4||!state.swapped)return FLOORS[f].words;return FLOORS[f].words.map(w=>w.id==='kakei'?{...w,k:'家財',r:'かざい'}:w)}
function solvedWord(f,id){return state.solved[f].includes(id)}
function floorComplete(f){return FLOORS[f].words.every(w=>solvedWord(f,w.id))}
function allComplete(){return [1,2,3,4,5].every(f=>floorComplete(f))}
function tileKanji(f){if(f===4&&state.swapped)return ['警','家','秘','門','地','殿','財','出','宝','報','神','下','口','系'];return TILE_ORDER[f].slice()}
function usedKanji(f){const used=[];effectiveWords(f).forEach(w=>{if(solvedWord(f,w.id))[...w.k].forEach(c=>used.push(c))});return used}
function coordKey(r,c){return r+','+c}
function boardMap(f){const map=new Map(), counts=new Map();effectiveWords(f).forEach(w=>{cellsFor(w).forEach(x=>{const k=coordKey(x.row,x.col);if(!map.has(k))map.set(k,{ch:x.ch,ids:[w.id]});else map.get(k).ids.push(w.id);counts.set(k,(counts.get(k)||0)+1)})});return {map,counts}}
function render(){renderTabs();renderFloor();save()}
function renderTabs(){const tabs=document.getElementById('tabs');tabs.innerHTML='';for(let f=1;f<=state.unlocked;f++){const b=document.createElement('button');b.className='tab'+(state.floor===f?' active':'');b.textContent=f+'F';b.onclick=()=>{state.floor=f;state.selected=[];render()};tabs.appendChild(b)}}
function renderFloor(){const f=state.floor;document.getElementById('floorName').textContent=FLOORS[f].name;document.getElementById('count').textContent=`${state.solved[f].length} / 6`;renderBoard(f);renderTiles(f);renderInventory();renderStairs(f);renderMeta()}
function renderBoard(f){const board=document.getElementById('board');board.innerHTML='';const {map,counts}=boardMap(f);for(let r=1;r<=11;r++)for(let c=1;c<=11;c++){
  const d=document.createElement('div');d.className='cell';const k=coordKey(r,c);const info=map.get(k);
  if(info){d.classList.add('path');if((counts.get(k)||0)>1)d.classList.add('cross');const visible=info.ids.some(id=>solvedWord(f,id));d.textContent=visible?info.ch:'';if(!visible)d.classList.add('emptytext');
    const meta=META.find(m=>m.f===f&&m.row===r&&m.col===c);if(state.metaUnlocked&&meta){d.dataset.num=['','①','②','③','④','⑤','⑥','⑦'][meta.n];d.classList.add('meta-ready','hot');d.onclick=()=>collectMeta(meta)}
    if(f===4 && state.trap && info.ids.includes('kakei')){d.classList.add('hot');d.onclick=()=>trySwap()}
    if(f===4 && state.rockRead && !state.trap && info.ids.includes('keihou')){d.classList.add('hot');d.onclick=()=>triggerTrap()}
    if(f===1 && state.finalRead && info.ids.includes('zaihou')){d.classList.add('hot');d.onclick=()=>finishGame()}
  }
  if(f===5 && r===6&&c===6){d.className='cell rock';d.textContent='岩';d.onclick=readRock}
  board.appendChild(d)
}}
function renderTiles(f){const holder=document.getElementById('tiles');holder.innerHTML='';const used=usedKanji(f);tileKanji(f).forEach(ch=>{
  if(state.picked[f]&&ch===FLOORS[f].extra)return;
  const b=document.createElement('button');b.className='tile';b.textContent=ch;const isUsed=used.includes(ch);
  const swappedOut=(f===4&&state.swapped&&ch==='系');
  if(isUsed){b.classList.add('used');b.disabled=true}
  else if(swappedOut){b.onclick=()=>{if(!state.inventory.includes('系')){state.inventory.push('系');toast('系 を拾った');render()}}}
  else if(ch===FLOORS[f].extra && floorComplete(f)){b.onclick=()=>pickLoose(f,ch)}
  else{b.onclick=()=>selectTile(ch)}
  if(state.selected.includes(ch))b.classList.add('selected');holder.appendChild(b)
})}
function selectTile(ch){if(state.selected.includes(ch)){state.selected=state.selected.filter(x=>x!==ch);render();return}state.selected.push(ch);if(state.selected.length===2){const pair=state.selected.join('');const w=FLOORS[state.floor].words.find(x=>x.k===pair&&!solvedWord(state.floor,x.id));if(w){state.solved[state.floor].push(w.id);toast(`${w.k} → ${w.r}`);state.selected=[];if(floorComplete(state.floor)){setTimeout(()=>onFloorComplete(state.floor),250)}}else{toast('その組み合わせではないようだ');state.selected=[]}}render()}
function onFloorComplete(f){if(f===5){if(allComplete()&&!state.metaUnlocked){state.metaUnlocked=true;modal('……どこかで、音がした。','');render()}}else{render()}}
function renderStairs(f){const s=document.getElementById('stairs');const can=floorComplete(f)&&f<5&&state.unlocked===f;s.classList.toggle('show',can);s.onclick=()=>{state.unlocked=Math.max(state.unlocked,f+1);state.floor=f+1;state.selected=[];toast('階段が現れた');render()}}
function pickLoose(f,ch){if(!floorComplete(f))return;state.picked[f]=true;if(!state.inventory.includes(ch))state.inventory.push(ch);toast(`${ch} を拾った`);render()}
function renderInventory(){const sec=document.getElementById('inventorySection'),holder=document.getElementById('inventory');holder.innerHTML='';sec.style.display=state.inventory.length?'block':'none';state.inventory.forEach(ch=>{const b=document.createElement('button');b.className='inv-tile'+(state.invSelected===ch?' selected':'');b.textContent=ch;b.onclick=()=>{state.invSelected=state.invSelected===ch?null:ch;render()};holder.appendChild(b)})}
function renderMeta(){const box=document.getElementById('meta'),slots=document.getElementById('slots');box.classList.toggle('show',state.metaUnlocked&&state.metaFound.length>0);slots.innerHTML='';for(let n=1;n<=7;n++){const m=META.find(x=>x.n===n);const s=document.createElement('div');s.className='slot';s.textContent=state.metaFound.includes(n)?m.ch:'';slots.appendChild(s)}}
function collectMeta(m){if(!state.metaUnlocked)return;if(!state.metaFound.includes(m.n)){state.metaFound.push(m.n);state.metaFound.sort((a,b)=>a-b);toast(`${['','①','②','③','④','⑤','⑥','⑦'][m.n]} ${m.ch}`);render()}}
function readRock(){if(!state.metaUnlocked){toast('硬い岩だ');return}if(state.metaFound.length<7){toast('硬い岩だ');return}if(state.swapped){state.finalRead=true;toast('岩の下を、もう一度確かめる');}else{state.rockRead=true;toast('岩の下へ、空洞が続いている');}render()}
function triggerTrap(){if(state.trap)return;state.trap=true;modal('警報が鳴り響いた！','足元が崩れた。\n\n気がつくと、1Fまで落とされていた。',()=>{state.floor=1;render()});render()}
function trySwap(){if(!state.trap||state.swapped)return;if(state.invSelected!=='財'){toast('何か使えそうなものがあれば……');return}if(!state.inventory.includes('財'))return;state.inventory=state.inventory.filter(x=>x!=='財');state.invSelected=null;state.swapped=true;toast('家系 → 家財');modal('家財','「系」を外し、「財」をはめた。');render()}
function finishGame(){if(state.clear)return;state.clear=true;modal('財宝を見つけた！','上へ上へと進んだ末、宝は最初の階に眠っていた。\n\nCLEAR');render()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1500)}
function modal(title,text,after){const m=document.getElementById('modal');document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text||'';m.classList.add('show');const btn=document.getElementById('modalBtn');btn.onclick=()=>{m.classList.remove('show');if(after)after()}}
document.getElementById('resetBtn').onclick=()=>{if(confirm('進行状況をすべて消しますか？')){localStorage.removeItem(SAVE);location.reload()}}
render();
</script>
</body>
</html>
